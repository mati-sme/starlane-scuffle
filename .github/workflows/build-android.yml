name: build-android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run build:www
      - run: npx cap sync android
      - name: Build APK (debug-signed, free to distribute)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk starlane-scuffle.apk
      - uses: actions/upload-artifact@v4
        with: { name: starlane-scuffle-apk, path: starlane-scuffle.apk }
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: starlane-scuffle.apk
      - name: Attach to the package version's Release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view v$V >/dev/null 2>&1 || gh release create v$V --title "Starlane Scuffle v$V" --notes "Android APK + macOS (Apple Silicon) dmg. See README for install steps."
          gh release upload v$V starlane-scuffle.apk --clobber
