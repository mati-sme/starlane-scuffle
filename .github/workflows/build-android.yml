name: build-android
on:
  workflow_dispatch:
  push:
    tags: ['v4*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build:www
      - run: npx cap sync android
      - name: Build APK (debug-signed, free to distribute)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk starlane-scuffle.apk
      - uses: actions/upload-artifact@v4
        with: { name: starlane-scuffle-apk, path: starlane-scuffle.apk }
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v4')
        uses: softprops/action-gh-release@v2
        with:
          files: starlane-scuffle.apk
