name: build-macos
on:
  workflow_dispatch:
  push:
    tags: ['v5*']
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run build:www
      - name: Build unsigned .dmg
        run: npx tauri build --bundles dmg
      - name: Name DMG
        run: cp src-tauri/target/release/bundle/dmg/*.dmg Starlane-Scuffle-arm64.dmg
      - uses: actions/upload-artifact@v4
        with: { name: starlane-scuffle-dmg, path: Starlane-Scuffle-arm64.dmg }
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v5')
        uses: softprops/action-gh-release@v2
        with:
          files: Starlane-Scuffle-arm64.dmg
      - name: Attach to v5.0.1 Release (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v5.0.1 >/dev/null 2>&1 || gh release create v5.0.1 --title "Starlane Scuffle v5.0.1" --notes "Android APK + macOS (Apple Silicon) dmg. See README for install steps."
          gh release upload v5.0.1 Starlane-Scuffle-arm64.dmg --clobber
