name: build-macos
on:
  workflow_dispatch:
  push:
    tags: ['v4*']
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npm run build:www
      - name: Build unsigned .dmg
        run: npx tauri build --bundles dmg
      - name: Name DMG
        run: cp src-tauri/target/release/bundle/dmg/*.dmg Starlane-Scuffle-arm64.dmg
      - uses: actions/upload-artifact@v4
        with: { name: starlane-scuffle-dmg, path: Starlane-Scuffle-arm64.dmg }
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v4')
        uses: softprops/action-gh-release@v2
        with:
          files: Starlane-Scuffle-arm64.dmg
