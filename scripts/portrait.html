<!doctype html>
<!-- Portrait studio for scripts/make-portraits.mjs: renders each champion's in-game model as a lit bust over a painted
     backdrop and exposes window.portrait(id) -> PNG data URL. Not shipped; open with ?gfx=high so metal gets reflections. -->
<meta charset="utf-8">
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<body style="margin:0;background:#000">
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { HEROES } from '/js/heroes/index.js';

const OUT = 256, SS = 2, R = OUT * SS; // render at 2x, downsample for clean edges
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(R, R, false);
renderer.setClearColor(0, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;
scene.add(new THREE.HemisphereLight(0xB4CAEC, 0x2A2438, 0.6));
const key = new THREE.DirectionalLight(0xFFE6C8, 1.9);
key.position.set(-3, 4, 5);
const rimL = new THREE.DirectionalLight(0xffffff, 2.2), rimR = new THREE.DirectionalLight(0xffffff, 2.6);
rimL.position.set(-5, 2, -4); rimR.position.set(5, 3, -3);
const fill = new THREE.DirectionalLight(0x9FB8FF, 0.5);
fill.position.set(4, 0, 4);
scene.add(key, rimL, rimR, fill);
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 50);

const css = (n) => '#' + new THREE.Color(n).getHexString();
const mix = (a, b, k) => '#' + new THREE.Color(a).lerp(new THREE.Color(b), k).getHexString();

// Deterministic per-champion noise so reruns produce identical files.
const rng = (seed) => () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 2 ** 32);
const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);

function backdrop(g, def) {
  const fx = def.fx?.color ?? def.basic?.color ?? def.accent, rand = rng(hash(def.id));
  const bg = g.createLinearGradient(0, 0, 0, OUT);
  bg.addColorStop(0, mix(def.color, 0x0A0F1E, 0.55)); bg.addColorStop(1, '#070A14');
  g.fillStyle = bg; g.fillRect(0, 0, OUT, OUT);
  // Big soft energy bloom behind the head in the champion's ability color.
  const halo = g.createRadialGradient(OUT * 0.52, OUT * 0.36, 4, OUT * 0.52, OUT * 0.4, OUT * 0.62);
  halo.addColorStop(0, mix(fx, 0xffffff, 0.25) + 'cc'); halo.addColorStop(0.35, css(fx) + '55'); halo.addColorStop(1, css(fx) + '00');
  g.fillStyle = halo; g.fillRect(0, 0, OUT, OUT);
  // Diagonal speed streaks and a starfield.
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 9; i++) {
    const x = rand() * OUT * 1.4 - OUT * 0.2, w = 2 + rand() * 10;
    g.fillStyle = css(def.accent) + Math.floor(12 + rand() * 22).toString(16);
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x + w, 0); g.lineTo(x + w - OUT * 0.5, OUT); g.lineTo(x - OUT * 0.5, OUT); g.fill();
  }
  for (let i = 0; i < 40; i++) {
    g.fillStyle = `rgba(255,255,255,${0.2 + rand() * 0.6})`;
    const s = rand() < 0.15 ? 2 : 1;
    g.fillRect(rand() * OUT, rand() * OUT * 0.7, s, s);
  }
  g.restore();
}

function finish(g, def) {
  // Ground glow, vignette and a bright frame line in the champion color.
  const low = g.createLinearGradient(0, OUT * 0.62, 0, OUT);
  low.addColorStop(0, 'rgba(7,10,20,0)'); low.addColorStop(1, 'rgba(7,10,20,0.85)');
  g.fillStyle = low; g.fillRect(0, 0, OUT, OUT);
  const v = g.createRadialGradient(OUT / 2, OUT / 2, OUT * 0.38, OUT / 2, OUT / 2, OUT * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, OUT, OUT);
  g.strokeStyle = mix(def.color, 0xffffff, 0.35) + '66'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, OUT - 3, OUT - 3);
}

window.portrait = (id) => {
  const def = HEROES[id], m = def.buildModel(0);
  const fx = def.fx?.color ?? def.basic?.color ?? def.accent;
  rimL.color.set(fx); rimR.color.set(mix(def.accent, 0xffffff, 0.4));
  // Hero pose: weapon arm cocked out to the side, off hand slightly forward; body turned to a 3/4 view.
  m.arms[0].rotation.set(-0.35, 0, 0.55);
  m.arms[1].rotation.set(-0.3, 0, -0.2);
  m.root.rotation.y = -0.45;
  scene.add(m.root);
  m.root.updateMatrixWorld(true);
  // Frame head + shoulders around the visor: ~2 units tall, eyes in the upper third.
  const eye = m.eyes.getWorldPosition(new THREE.Vector3()), viewH = 2.05 * (def.model.w ?? 1);
  const dist = viewH / 2 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const aim = new THREE.Vector3(0, eye.y - viewH * 0.17, 0);
  camera.position.set(aim.x + 0.2, aim.y + 0.45, dist);
  camera.lookAt(aim);
  renderer.render(scene, camera);
  scene.remove(m.root);

  const c = document.createElement('canvas');
  c.width = c.height = OUT;
  const g = c.getContext('2d');
  g.imageSmoothingQuality = 'high';
  backdrop(g, def);
  // Colored drop glow under the model so the silhouette pops from the backdrop.
  g.save(); g.filter = 'blur(6px) brightness(0)'; g.globalAlpha = 0.7;
  g.drawImage(renderer.domElement, 0, 3, OUT, OUT); g.restore();
  g.drawImage(renderer.domElement, 0, 0, OUT, OUT);
  finish(g, def);
  return c.toDataURL('image/png');
};
window.portraitIds = Object.keys(HEROES);
window.ready = true;
</script>
